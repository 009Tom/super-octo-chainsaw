<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="源码印记">
  <!--
    应用图标「源码印记」
    构思：三片半透明圆角板沿对角错落层叠（代表一块块代码模块 / 卡片），
    最上面一片中央刻着一个凹槽——就是"印记"。全程没有字母和代码符号。
    体积感来源：轴测投影（旋转 45° 后纵向压扁）+ 每片下面多画一层"侧壁"当厚度
    + 左上方向的侧边打光（顶面渐变上亮下暗）+ 边缘高光 + 柔和投影。
  -->
  <defs>
    <!-- 深色科技底板：左上略亮，向右下压暗 -->
    <linearGradient id="si-plate" x1="14" y1="8" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#223354" />
      <stop offset=".5" stop-color="#111C30" />
      <stop offset="1" stop-color="#070C17" />
    </linearGradient>
    <!-- 侧边打光：一束冷光从左上角铺进来 -->
    <radialGradient id="si-side" cx="24" cy="16" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CC6FF" stop-opacity=".32" />
      <stop offset=".5" stop-color="#5B8FD0" stop-opacity=".08" />
      <stop offset="1" stop-color="#5B8FD0" stop-opacity="0" />
    </radialGradient>
    <clipPath id="si-clip"><rect x="4" y="4" width="120" height="120" rx="30" /></clipPath>

    <!-- 三片玻璃的顶面：靠近光源的一片最亮，往下逐片变深 -->
    <linearGradient id="si-g1" x1="28" y1="64" x2="94" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8EEFF" stop-opacity=".8" />
      <stop offset=".45" stop-color="#5FA3E6" stop-opacity=".3" />
      <stop offset="1" stop-color="#1B3760" stop-opacity=".3" />
    </linearGradient>
    <linearGradient id="si-g2" x1="40" y1="42" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFE5FF" stop-opacity=".85" />
      <stop offset=".5" stop-color="#9C84E6" stop-opacity=".34" />
      <stop offset="1" stop-color="#2A2A5C" stop-opacity=".32" />
    </linearGradient>
    <linearGradient id="si-g3" x1="54" y1="22" x2="104" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95" />
      <stop offset=".42" stop-color="#9BE7D0" stop-opacity=".46" />
      <stop offset="1" stop-color="#225960" stop-opacity=".38" />
    </linearGradient>
    <!-- 侧壁 = 板的厚度，永远比顶面暗 -->
    <linearGradient id="si-wall" x1="0" y1="18" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22375C" />
      <stop offset="1" stop-color="#080E1D" />
    </linearGradient>
    <!-- 边缘高光：左上亮、右下几乎消失，模拟掠射光 -->
    <linearGradient id="si-rim" x1="6" y1="14" x2="122" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92" />
      <stop offset=".45" stop-color="#C7DCF7" stop-opacity=".26" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".05" />
    </linearGradient>
    <linearGradient id="si-shaft" x1="0" y1="0" x2=".62" y2="1">
      <stop offset="0" stop-color="#D5EBFF" stop-opacity=".15" />
      <stop offset=".55" stop-color="#D5EBFF" stop-opacity="0" />
    </linearGradient>

    <filter id="si-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="si-drop" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.4" flood-color="#000000" flood-opacity=".5" />
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#si-plate)" />
  <g clip-path="url(#si-clip)">
    <rect x="4" y="4" width="120" height="120" fill="url(#si-side)" />
    <!-- 斜切的光带，加强"侧边打光"的空间感 -->
    <path d="M2 40 L46 4 L84 4 L10 96 Z" fill="url(#si-shaft)" />
  </g>
  <rect x="4.8" y="4.8" width="118.4" height="118.4" rx="29.2" fill="none" stroke="#9FC4F0" stroke-opacity=".2" />

  <!-- 层叠错落的三片（含落地投影）：整组放大 1.1 倍，让底板四周留白更均衡 -->
  <g transform="translate(64 68) scale(1.1) translate(-64 -64)">
  <ellipse cx="66" cy="103" rx="33" ry="8" fill="#000000" opacity=".5" filter="url(#si-soft)" />
  <g filter="url(#si-drop)">
    <!-- 底层：最深的蓝，压在下面 -->
    <g transform="translate(0 6)">
      <g transform="translate(50 84) scale(1 .56) rotate(45)">
        <rect x="-21" y="-21" width="42" height="42" rx="13" fill="url(#si-wall)" />
      </g>
    </g>
    <g transform="translate(50 84) scale(1 .56) rotate(45)">
      <rect x="-21" y="-21" width="42" height="42" rx="13" fill="url(#si-g1)" stroke="url(#si-rim)" stroke-width="1.4" />
    </g>

    <!-- 中层：偏紫，往右上抬一档 -->
    <g transform="translate(0 5.5)">
      <g transform="translate(64 62) scale(1 .56) rotate(45)">
        <rect x="-19" y="-19" width="38" height="38" rx="12" fill="url(#si-wall)" />
      </g>
    </g>
    <g transform="translate(64 62) scale(1 .56) rotate(45)">
      <rect x="-19" y="-19" width="38" height="38" rx="12" fill="url(#si-g2)" stroke="url(#si-rim)" stroke-width="1.3" />
    </g>

    <!-- 顶层：最亮的青白玻璃，正中央刻出凹槽印记 -->
    <g transform="translate(0 5)">
      <g transform="translate(78 40) scale(1 .56) rotate(45)">
        <rect x="-16.5" y="-16.5" width="33" height="33" rx="10.5" fill="url(#si-wall)" />
      </g>
    </g>
    <g transform="translate(78 40) scale(1 .56) rotate(45)">
      <rect x="-16.5" y="-16.5" width="33" height="33" rx="10.5" fill="url(#si-g3)" stroke="url(#si-rim)" stroke-width="1.3" />
      <!-- 凹槽：里面压暗，右下留一道反光，看着像刻进去的 -->
      <rect x="-6" y="-6" width="12" height="12" rx="4.6" fill="#050A14" fill-opacity=".55" />
      <rect x="-6" y="-6" width="12" height="12" rx="4.6" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1" />
    </g>
  </g>
  </g>
</svg>
