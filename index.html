<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 响应式 viewport：手机端适配的关键；viewport-fit=cover 让 iOS 刘海屏的安全区变量生效 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="源码印记：Markdown 学习笔记、AI 学习助手与开发者工具箱，纯前端 + localStorage。" />
  <meta name="theme-color" content="#F5F7FA" />
  <meta name="color-scheme" content="light" />
  <!-- 应用图标：层叠玻璃板的「源码印记」标记，无字母无代码符号；iOS 加到桌面时优先读 apple-touch-icon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="apple-mobile-web-app-title" content="源码印记" />
  <title>源码印记 | 我的个人学习记录</title>
  <style>
    /* 首屏占位动画：JS 包还没加载完时也有动态效果，和 Vue 的开屏动画无缝衔接 */
    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      /* 与应用背景同一个中性浅灰，加载过程不闪烁 */
      background: #F5F7FA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    }
    /* 直接用应用图标本体当加载指示：轻微浮动 + 自身投影，和 Vue 开屏动画同一套视觉 */
    .boot .mark {
      width: 64px;
      height: 64px;
      display: block;
      margin: 0 auto;
      animation: bootFloat 2.4s ease-in-out infinite;
      filter: drop-shadow(0 10px 18px rgba(15, 23, 42, 0.18));
    }
    @keyframes bootFloat {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50% { transform: translateY(-9px) rotate(1.5deg); }
    }
    .boot .txt {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 2px;
      color: #6b7280;
      animation: bootFade 1.6s ease-in-out infinite;
    }
    @keyframes bootFade { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <!-- Vue 应用挂载点；里面是应用加载前的占位动画，挂载后会自动被替换 -->
  <div id="app">
    <div class="boot">
      <div>
        <img class="mark" src="/favicon.svg" alt="" />
        <div class="txt">正在打开源码印记…</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
